[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "academic-insight-ai"
version = "0.1.0"
description = "Academic local LLM workbench for repeatable task pipelines"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115,<1",
  "pypdf>=5.0,<7",
  "pydantic>=2.7,<3",
  "pymysql>=1.1,<2",
  "python-multipart>=0.0.9,<1",
  "python-dotenv>=1.0,<2",
  "requests>=2.32,<3",
  "typer>=0.12,<1",
  "uvicorn>=0.30,<1",
]

[project.scripts]
academic-ai = "academic_insight_ai.cli.main:app"
academic-classification-api = "academic_insight_ai.apis.classification:run"
academic-reader-api = "academic_insight_ai.apis.reader:run"

[project.optional-dependencies]
dev = ["pytest>=8,<10"]
scopus-export = ["openpyxl>=3.1,<4"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
